[package]
name = "kleib3ry"
version = "0.1.0"
description = "kleib3ry — a 3D personal library"
authors = ["iklei"]
edition = "2021"
rust-version = "1.77.2"
# `src/bin/scan.rs` is a dev-only harness, so bare `cargo run` (which is what
# `tauri dev` shells out to) would otherwise be ambiguous.
default-run = "kleib3ry"

[lib]
# The desktop binary and any future mobile target share this crate.
name = "kleib3ry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Indexing, SQLite and the format probes live in their own crate, which knows
# nothing about a window — see `../core`. That is what lets the server image be
# a static binary instead of a Linux box carrying a browser engine.
kleib3ry_core = { path = "../core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.23.1"

[features]
# Used by `tauri dev` to keep the devtools available in release-ish builds.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# NOT `panic = "abort"`. Third-party format parsers panic on malformed files,
# and a single unreadable book must not take the whole app down mid-scan; the
# indexer catches unwinds per file and carries on.
strip = true
