[package]
name = "kleib3ry_core"
version = "0.1.0"
description = "Indexing, persistence and format probing for kleib3ry — no shell, no window"
authors = ["iklei"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kleib3ry_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2.5.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
zip = "4.2.0"
quick-xml = "0.39.4"
sha2 = "0.10.9"
lopdf = "0.36.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# NOT `panic = "abort"`. Third-party format parsers panic on malformed files,
# and a single unreadable book must not take a scan down; the indexer catches
# unwinds per file and carries on.
strip = true
