[package]
name = "kleib3ry_core"
version = "0.1.0"
description = "Indexing, persistence and format probing for kleib3ry — no shell, no window"
authors = ["iklei"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kleib3ry_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2.5.0"
zip = "4.2.0"
quick-xml = "0.39.4"
sha2 = "0.10.9"
lopdf = "0.36.0"
# The one dependency that reaches the network, for `paper`: arXiv is fetched
# here rather than in the front end, because a browser cannot make that request
# and because what comes back is a file in the library folder. Blocking and
# rustls-backed, so there is no async runtime and no system OpenSSL in the
# container image.
ureq = "3.4.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# NOT `panic = "abort"`. Third-party format parsers panic on malformed files,
# and a single unreadable book must not take a scan down; the indexer catches
# unwinds per file and carries on.
strip = true
