# The same gate `npm run verify` runs locally, split in two.
#
# The fast half — lint, typecheck, build, clippy, cargo test — is a couple of
# minutes and gates every push. The Playwright half is half an hour, because the
# smoke tests rasterise the whole cabin on SwiftShader, so it runs beside the
# fast one rather than behind it: a typo in a shader should not be thirty
# minutes from being reported.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; nobody needs the older answer.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front-end:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # pdf.js fonts and cmaps, the sample book and the demo ROM. Deliberately
      # not committed, so nothing below works without this.
      - run: npm run assets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  rust:
    name: clippy and cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only core and server: src-tauri needs GTK and WebKit, which is the whole
      # reason core was carved out of it. The desktop shell is checked on the
      # Windows job below, where it is actually built.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path core/Cargo.toml
      - run: cargo test --manifest-path server/Cargo.toml

  desktop-shell:
    name: clippy and cargo test (desktop shell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  smoke:
    name: playwright
    runs-on: ubuntu-latest
    # Thirty-odd minutes on a software rasteriser, and slower on a busy runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run assets
      - run: npx playwright install --with-deps chromium
      # The suite serves the production bundle, so it has to exist first.
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  container:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Not pushed anywhere — this only has to prove the three-stage build still
      # assembles, which is the thing that breaks when a script or a copy moves.
      - run: docker build -t kleib3ry .
